<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1781cf">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Subway Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Subway Runner 3D game"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <main id="ui"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="loading" role="status" aria-live="polite"><div class="splash-art"><img src="assets/app-icon.png" alt="Subway Runner game artwork"><span class="splash-brand">SUBWAY <em>RUNNER</em></span></div><strong>THE CITY IS CALLING!</strong><span id="loading-status">Preparing your city…</span><div class="loading-track" aria-hidden="true"><div class="loading-bar" id="loading-bar"></div></div><span id="loading-percent">0%</span></div>
  <script src="loader.js"></script>
  <script src="assets/models.js"></script>
  <script src="assets/fox.js"></script>
  <script src="assets/kenney_models.js"></script>
  <script src="assets/quaternius_props.js"></script>
  <script src="assets/skinned_characters.js"></script>
  <script src="skinned_player.js"></script>
  <script src="simulation.js"></script>
  <script src="renderer.js"></script>
  <script src="platform.js"></script>
  <script src="app.js"></script>
</body>
</html>
