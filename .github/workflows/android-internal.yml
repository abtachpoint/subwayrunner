name: Android internal-testing bundle

on:
  workflow_dispatch:
    inputs:
      production:
        description: Require live ad configuration and authorized upload signing
        type: boolean
        default: false
      ads_mode:
        description: Internal/development builds use official Google test rewarded units
        type: choice
        options: [test, live]
        default: test

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAY_GAMES_APP_ID: "613238310945"
      ADS_MODE: ${{ inputs.ads_mode }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install matching Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore private owner upload key when configured
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          value = os.environ.get('UPLOAD_KEYSTORE_BASE64', '')
          if value:
              target = Path(os.environ['RUNNER_TEMP']) / 'subway-runner-upload.jks'
              target.write_bytes(base64.b64decode(value, validate=True))
              target.chmod(0o600)
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('ANDROID_KEYSTORE_PATH=' + str(target) + '\n')
              print('Owner upload keystore restored to private runner storage.')
          else:
              print('No owner upload keystore supplied; internal bundle will be unsigned and cannot be uploaded yet.')
          PY
      - name: Test existing game and new bridge/economy logic
        run: node --test tests/*.test.cjs
      - name: Test worker security and economy
        working-directory: worker
        run: npm test
      - name: Build real Android application bundle
        env:
          REQUIRE_PRODUCTION: ${{ inputs.production }}
        run: |
          if [ "$REQUIRE_PRODUCTION" = true ]; then
            bash tools/build_android.sh --production
          else
            bash tools/build_android.sh --ads-mode "$ADS_MODE"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Subway-Runner-internal-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            release/*.aab
            release/*.aab.sha256
            android/app/build/reports/
            android/app/build/test-results/
      - name: Remove private temporary signing file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/subway-runner-upload.jks"
